services:

  postgres:
    image: postgres:16
    container_name: hpqms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: hpqms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: hpqms

    volumes:
      - hpqms_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpqms -d hpqms"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: hpqms-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://hpqms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/hpqms
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
      KIOSK_INTERNAL_API_KEY: ${KIOSK_INTERNAL_API_KEY:?Set KIOSK_INTERNAL_API_KEY in the root .env file}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      INITIAL_ADMIN_EMPLOYEE_ID: ${INITIAL_ADMIN_EMPLOYEE_ID:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    command: >
      sh -c "alembic upgrade head &&
             python bootstrap_admin.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"


  caddy:
    image: caddy:2
    container_name: hpqms-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      backend:
        condition: service_healthy


volumes:
  hpqms_postgres_data:
  caddy_data:
  caddy_config:
