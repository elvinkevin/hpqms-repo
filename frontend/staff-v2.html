<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPQMS Header - Horizon General Hospital</title>
    <link rel="stylesheet" href="css/staff.css">
</head>
<body>
    <header class="header">
        <!-- Left Side: Logo + Horizon General Hospital Branding + Current Department -->
        <div class="header-left">
            <div class="header-branding">
                <!-- Teal Cross Logo -->
                <div class="logo">
                    <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <circle cx="26" cy="26" r="25" fill="#0F5B78"/>
                        <circle cx="26" cy="26" r="25" fill="url(#staffLogoGrad)"/>
                        <circle cx="26" cy="26" r="17" fill="#FFFFFF"/>
                        <path d="M26 16V36M16 26H36" stroke="#13A6A6" stroke-width="5" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="staffLogoGrad" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#0F5B78"/>
                                <stop offset="1" stop-color="#13A6A6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="hospital-info">
                    <h1>Horizon General Hospital</h1>
                    <p>Quality Care. Every Patient.</p>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Department switching is not supported; backend context is authoritative. -->
            <div class="department-select-wrapper">
                <select id="departmentSelect" class="department-select" disabled aria-label="Current department">
                    <option value="">Loading department...</option>
                </select>
                <svg class="select-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </div>
        </div>

        <!-- Right Side: Staff Details + Notifications + Logout -->
        <div class="header-right">
            <div class="staff-profile">
                <div class="avatar" role="img" aria-label="Staff profile"></div>
                <div class="staff-info">
                    <p class="staff-name" id="staffName">Loading...</p>
                    <p class="staff-role" id="staffRole">Staff</p>
                </div>
            </div>

            <div class="divider"></div>

            <div class="icon-btn-container">
                <!-- Notifications button -->
                <button class="notification-btn" title="Notifications">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="badge">3</span>
                </button>

                <!-- Logout Icon button -->
                <button id="logoutBtn" class="logout-btn" title="Log Out">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <script type="module" src="js/staff-v2.js"></script>
</body>
</html>
