<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPQMS Header - Horizon General Hospital</title>
    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/registration-drawer.css">
    <link rel="stylesheet" href="css/workspaces/reception-workspace.css">
    <link rel="stylesheet" href="css/workspaces/triage-workspace.css">
    <link rel="stylesheet" href="css/workspaces/doctor-workspace.css">
    <link rel="stylesheet" href="css/workspaces/admin.css">
</head>

<body>
    <div class="page-wrapper">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="header-branding">
                    <div class="logo">
                        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <circle cx="26" cy="26" r="25" fill="#0F5B78" />
                            <circle cx="26" cy="26" r="25" fill="url(#staffLogoGrad)" />
                            <circle cx="26" cy="26" r="17" fill="#FFFFFF" />
                            <path d="M26 16V36M16 26H36" stroke="#13A6A6" stroke-width="5" stroke-linecap="round" />
                            <defs>
                                <linearGradient id="staffLogoGrad" x1="0" y1="0" x2="52" y2="52"
                                    gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#0F5B78" />
                                    <stop offset="1" stop-color="#13A6A6" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="hospital-info">
                        <h1>Horizon General Hospital</h1>
                        <p>Quality Care. Every Patient.</p>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="department-select-wrapper">
                    <select id="departmentSelect" class="department-select" disabled aria-label="Current department">
                        <option value="">Reception Desk</option>
                    </select>
                    <svg class="select-icon" width="12" height="12" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M6 9l6 6 6-6" />
                    </svg>
                </div>
            </div>

            <div class="header-right">
                <div class="staff-profile" id="staffProfile">
                    <div class="avatar" role="img" aria-label="Staff profile"></div>
                    <div class="staff-info">
                        <p class="staff-name" id="staffName">Jane Moraa</p>
                        <p class="staff-role" id="staffRole">Receptionist</p>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="icon-btn-container">
                    <button class="notification-btn" title="Notifications">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                        </svg>
                        <span class="badge">3</span>
                    </button>

                    <button id="logoutBtn" class="logout-btn" title="Log Out">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                            <polyline points="16 17 21 12 16 7" />
                            <line x1="21" y1="12" x2="9" y2="12" />
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- LEFT: QUEUE COLUMN (Existing & Intact) -->
            <div class="queue-column">
                <!-- QUEUE PANEL -->
                <div class="queue-panel">
                    <div class="queue-header">
                        <div class="queue-title-row">
                            <div class="queue-title">
                                <h2>Department Flow Queue</h2>
                                <span class="active-badge" id="activeCount">18 Active</span>
                            </div>
                            <div class="last-updated" id="lastUpdated">Last updated: Just Now</div>
                        </div>

                        <div class="search-row">
                            <div class="search-wrapper">
                                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                                <input type="text" class="search-input" id="searchInput"
                                    placeholder="Search patient name, token ID..." aria-label="Search queue" />
                            </div>
                            <button class="refresh-btn" id="refreshBtn" title="Refresh queue">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="23 4 23 10 17 10"></polyline>
                                    <polyline points="1 20 1 14 7 14"></polyline>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15">
                                    </path>
                                </svg>
                            </button>
                        </div>

                        <div class="status-tabs">
                            <button class="status-tab active" data-status="all">
                                All
                                <span class="status-count">18</span>
                            </button>
                            <button class="status-tab" data-status="waiting">
                                Waiting
                                <span class="status-count">10</span>
                            </button>
                            <button class="status-tab" data-status="called">
                                Called
                                <span class="status-count">4</span>
                            </button>
                            <button class="status-tab" data-status="in-progress">
                                In Progress
                                <span class="status-count">4</span>
                            </button>
                            <button class="status-tab no-show-tab" data-status="no-show">
                                No-Show
                                <span class="status-count">0</span>
                            </button>
                        </div>
                    </div>

                    <div class="queue-table-wrapper">
                        <table class="queue-table">
                            <colgroup>
                                <col style="width: 15%">
                                <col style="width: 30%">
                                <col style="width: 15%">
                                <col style="width: 20%">
                                <col style="width: 20%">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th>Token</th>
                                    <th>Patient</th>
                                    <th>Wait</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="queueTableBody">
                                <!-- Populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>

                    <div class="queue-footer">
                        <button class="queue-btn queue-btn-primary" id="callNextBtn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                </path>
                            </svg>
                            Call Next Token
                        </button>
                        <button class="queue-btn queue-btn-secondary" id="startServiceBtn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            Start Service
                        </button>
                        <button class="queue-btn queue-btn-secondary" id="markNoShowBtn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="15" y1="9" x2="9" y2="15"></line>
                                <line x1="9" y1="9" x2="15" y2="15"></line>
                            </svg>
                            Mark No-Show
                        </button>
                    </div>

                    <!-- NO-SHOW PANEL -->
                    <div class="noshow-panel hidden" id="noshowPanel">
                        <div class="noshow-header">
                            <h3 class="noshow-title">No-Show</h3>
                        </div>

                        <div class="noshow-table-wrapper">
                            <table class="noshow-table">
                                <thead>
                                    <tr>
                                        <th>Token ID</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="noshowTableBody">
                                    <!-- Populated by JavaScript -->
                                </tbody>
                            </table>
                            <div id="noshowState" class="empty-state"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: ENCOUNTER COLUMN -->
            <section class="encounter-column">
                <div id="encounterMount">
                    <!-- Managed dynamically by encounter-panel.js -->
                </div>
            </section>

        </main>

        <script type="module" src="js/staff-v2.js"></script>
</body>

</html>
