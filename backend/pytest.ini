[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = . backend backend/app
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --showlocals

filterwarnings =
    ignore::sqlalchemy.exc.SAWarning
    ignore:The garbage collector is trying to clean up non-checked-in connection
    ignore:.*greenlet is being finalized.*
    ignore::DeprecationWarning
    ignore::UserWarning

    